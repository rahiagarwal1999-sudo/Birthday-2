      const AVAILABLE_SONGS = [

      class AudioEngine {
        constructor() {
          this.ctx = null;
          this.isPlayingMusic = false;
          this.musicTimer = null;
          this.currentSongIndex = 0;
          this.onTimeUpdateCallback = null;
          this.currentSeconds = 24;
        }

        getContext() {
          if (!this.ctx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContextClass();
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume();
          }
          return this.ctx;
        }

        playChime(freq, duration = 1.2, volume = 0.16) {
          try {
            const ctx = this.getContext();
            const osc = ctx.createOscillator();
            const oscHarmonic = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = "sine";
            oscHarmonic.type = "triangle";

            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            oscHarmonic.frequency.setValueAtTime(freq * 2.01, ctx.currentTime);

            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

            osc.connect(gain);
            oscHarmonic.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            oscHarmonic.start();
            osc.stop(ctx.currentTime + duration);
            oscHarmonic.stop(ctx.currentTime + duration);
          } catch (e) {
            // Audio context might be restricted before user gesture
          }
        }

        playSealPop() {
          try {
            const ctx = this.getContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(240, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.25);

            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);

            setTimeout(() => this.playChime(N.C5, 0.8, 0.1), 80);
            setTimeout(() => this.playChime(N.E5, 1.0, 0.12), 160);
            setTimeout(() => this.playChime(N.G5, 1.4, 0.15), 240);
            setTimeout(() => this.playChime(N.C6, 1.8, 0.18), 320);
          } catch (e) {
            // ignore
          }
        }

        playFlowerBloom() {
          const notes = [N.A4, N.Cs5, N.E5, N.A5];
          notes.forEach((freq, i) => {
            setTimeout(() => {
              this.playChime(freq, 1.0, 0.12);
            }, i * 70);
          });
        }

        playPageTurn() {
          this.playChime(N.A4, 0.4, 0.08);
        }

        getCurrentSong() {
          return AVAILABLE_SONGS[this.currentSongIndex] || AVAILABLE_SONGS[0];
        }

        setSong(songId) {
          const idx = AVAILABLE_SONGS.findIndex((s) => s.id === songId);
          if (idx !== -1) {
            this.currentSongIndex = idx;
            if (this.isPlayingMusic) {
              this.startMusic(this.onTimeUpdateCallback || undefined);
            } else if (this.onTimeUpdateCallback) {
              this.onTimeUpdateCallback(this.currentSeconds, false, this.getCurrentSong());
            }
          }
        }

        nextSong() {
          this.currentSongIndex = (this.currentSongIndex + 1) % AVAILABLE_SONGS.length;
          if (this.isPlayingMusic) {
            this.startMusic(this.onTimeUpdateCallback || undefined);
          } else if (this.onTimeUpdateCallback) {
            this.onTimeUpdateCallback(this.currentSeconds, false, this.getCurrentSong());
          }
        }

        startMusic(onUpdate) {
          if (onUpdate) this.onTimeUpdateCallback = onUpdate;
          this.isPlayingMusic = true;
          this.getContext();

          if (this.musicTimer) {
            window.clearInterval(this.musicTimer);
          }

          const song = this.getCurrentSong();
          let noteIdx = 0;

          const playNext = () => {
            if (!this.isPlayingMusic) return;

            const current = song.notes[noteIdx];
            if (current && current.note > 0) {
              this.playChime(current.note, current.dur * 1.6, 0.17);
              if (noteIdx % 4 === 0) {
                this.playChime(current.note / 2, current.dur * 2.2, 0.09);
              }
            }

            this.currentSeconds = (this.currentSeconds + 1) % 210;
            if (this.onTimeUpdateCallback) {
              this.onTimeUpdateCallback(this.currentSeconds, true, song);
            }

            noteIdx = (noteIdx + 1) % song.notes.length;
          };

          playNext();
          this.musicTimer = window.setInterval(playNext, song.tempo);
        }

        stopMusic() {
          this.isPlayingMusic = false;
          if (this.musicTimer) {
            window.clearInterval(this.musicTimer);
            this.musicTimer = null;
          }
          if (this.onTimeUpdateCallback) {
            this.onTimeUpdateCallback(this.currentSeconds, false, this.getCurrentSong());
          }
        }

        toggleMusic(onUpdate) {
          if (this.isPlayingMusic) {
            this.stopMusic();
            return false;
          } else {
            this.startMusic(onUpdate);
            return true;
          }
        }

        getIsPlaying() {
          return this.isPlayingMusic;
        }
      }

      const triggerGrandCelebration = () => {
        const duration = 3.5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function () {
          const timeLeft = animationEnd - Date.now();

          if (timeLeft <= 0) {
            return clearInterval(interval);
          }

          const particleCount = 50 * (timeLeft / duration);
          confetti({
            ...defaults,
            particleCount,
            origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
            colors: ["#f43f5e", "#ec4899", "#8b5cf6", "#3b82f6", "#10b981", "#fbbf24"],

      /* ============================================================
       * GreetingScreen
       * ============================================================ */
      const GreetingScreen = ({ data, onNext }) => {
        const [isPlaying, setIsPlaying] = useState(audioEngine.getIsPlaying());
        const [progressSec, setProgressSec] = useState(24);
        const [currentTrack, setCurrentTrack] = useState(audioEngine.getCurrentSong());

        useEffect(() => {
          const updateHandler = (sec, playing, song) => {
            setProgressSec(sec);
            setIsPlaying(playing);
            if (song) setCurrentTrack(song);
          };

          if (!audioEngine.getIsPlaying()) {
            audioEngine.startMusic(updateHandler);
            setIsPlaying(true);
          } else {
            setIsPlaying(true);
          }

          const timer = setInterval(() => {
            setIsPlaying(audioEngine.getIsPlaying());
            setCurrentTrack(audioEngine.getCurrentSong());
          }, 500);

          return () => clearInterval(timer);
        }, []);

        const handleToggleMusic = () => {
          const playing = audioEngine.toggleMusic((sec, isPlay, song) => {
            setProgressSec(sec);
            setIsPlaying(isPlay);
            if (song) setCurrentTrack(song);
          });
          setIsPlaying(playing);
        };

        const formatTime = (seconds) => {
          const mins = Math.floor(seconds / 60);
          const secs = seconds % 60;
          return `${mins}:${secs.toString().padStart(2, "0")}`;
        };

        return (
          <motion.div
            initial={{ opacity: 0, y: 15 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0, y: -15 }}
            transition={{ duration: 0.5 }}
            className="w-full max-w-md mx-auto flex flex-col items-center min-h-[85vh] px-4 py-8 text-center relative"
          >
            <div className="absolute top-4 left-2 pointer-events-none opacity-85">
              <FlowerIcon type="pink" size={32} />
            </div>
            <div className="absolute top-4 right-2 pointer-events-none opacity-85">
              <FlowerIcon type="yellow" size={32} />
            </div>

            <motion.div
              initial={{ opacity: 0, y: -10 }}
              animate={{ opacity: 1, y: 0 }}
              className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-white/90 shadow-sm border border-rose-200/80 mb-6 text-xs sm:text-sm font-semibold tracking-wider text-rose-600 uppercase"
            >
              <Heart className="w-3.5 h-3.5 fill-rose-500 text-rose-500" />
              <span>A LITTLE BIRTHDAY WISH ♡</span>
            </motion.div>

            <div className="mb-5">
              <CuteMascot size={90} />
            </div>

            <h2 className="font-serif-display text-2xl sm:text-3xl font-semibold text-[#1e293b] mb-4">
              {data.greetingHeader}
            </h2>

            <div className="bg-white/90 backdrop-blur-xs rounded-2xl p-5 shadow-xs border border-rose-100 mb-6 text-[#475569] text-xs sm:text-sm leading-relaxed tracking-wider uppercase font-medium">
              {data.greetingMessage}
            </div>

            <div className="w-full bg-white/95 backdrop-blur-xs rounded-2xl p-4 shadow-sm border border-rose-100/90 mb-8">
              <div className="flex items-center justify-between gap-3 mb-3">
                <div className="relative w-12 h-12 rounded-xl bg-gradient-to-tr from-rose-400 via-pink-400 to-rose-300 flex items-center justify-center overflow-hidden shrink-0 border border-rose-200 shadow-inner">
                  <div className="text-center text-white">
                    <span className="text-sm">🎂</span>
                    <p className="text-[7px] text-white/90 font-bold leading-tight uppercase">BIRTHDAY SONG</p>
                  </div>
                  {isPlaying && (
                    <motion.div
                      className="absolute inset-0 border-2 border-white/50 rounded-full"
                      animate={{ rotate: 360 }}
                      transition={{ repeat: Infinity, duration: 4, ease: "linear" }}
                    />
                  )}
                </div>

                <div className="flex-1 text-left min-w-0">
                  <h3 className="text-xs sm:text-sm font-semibold text-[#1e293b] truncate">
                    {currentTrack.title} ♡
                  </h3>
                  <p className="text-[10px] sm:text-xs font-semibold text-rose-500 tracking-wider uppercase">
                    {currentTrack.artist}
                  </p>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={handleToggleMusic}
                    aria-label={isPlaying ? "Pause music" : "Play music"}
                    className="w-10 h-10 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white flex items-center justify-center transition-transform hover:scale-105 cursor-pointer shadow-sm"
                  >
                    {isPlaying ? <Pause className="w-4 h-4 fill-white" /> : <Play className="w-4 h-4 fill-white ml-0.5" />}
                  </button>
                </div>
              </div>

              <div className="space-y-1.5">
                <div className="w-full bg-rose-100/60 h-1.5 rounded-full overflow-hidden">
                  <motion.div
                    className="bg-gradient-to-r from-rose-400 via-pink-500 to-rose-500 h-full rounded-full"
                    style={{ width: `${Math.min(100, (progressSec / 180) * 100)}%` }}
                  />
                </div>
                <div className="flex justify-between text-[10px] text-[#94a3b8] font-mono">
                  <span>{formatTime(progressSec)}</span>
                  <span className="text-rose-400 text-[10px]">happy birthday melody ♪</span>
                </div>
              </div>

              <div className="mt-3 pt-2.5 border-t border-rose-100/60">
                <p className="text-xs text-[#64748b] font-script text-base text-center">"{data.musicNote}"</p>
              </div>
            </div>

            <motion.button
              whileHover={{ scale: 1.03 }}
              whileTap={{ scale: 0.97 }}
              onClick={onNext}
              className="w-full max-w-xs py-3.5 px-6 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 hover:from-rose-600 hover:to-pink-700 text-white font-semibold text-xs sm:text-sm tracking-wider uppercase shadow-[0_8px_22px_rgba(244,63,94,0.35)] flex items-center justify-center gap-2 cursor-pointer transition-all"
            >
              <span>SEE OUR ALBUM</span>
              <ArrowRight className="w-4 h-4" />
            </motion.button>
          </motion.div>
        );
      };

      /* ============================================================
       * AlbumScreen
       * ============================================================ */
      const AlbumScreen = ({ data, onNext, onBack }) => {
        const [currentIndex, setCurrentIndex] = useState(0);
        const memories = data.memories || [];
        const currentMem = memories[currentIndex] || memories[0];

        const handlePrev = () => {
          audioEngine.playPageTurn();
          setCurrentIndex((prev) => (prev > 0 ? prev - 1 : memories.length - 1));
        };

        const handleNext = () => {
          audioEngine.playPageTurn();
          setCurrentIndex((prev) => (prev < memories.length - 1 ? prev + 1 : 0));
        };

        return (
          <motion.div
            initial={{ opacity: 0, y: 15 }}
            animate={{ opacity: 1, y: 0 }}
            exit={{ opacity: 0, y: -15 }}
            transition={{ duration: 0.5 }}
            className="w-full max-w-md mx-auto flex flex-col items-center min-h-[85vh] px-4 py-8 text-center relative"
          >
            <div className="absolute top-12 left-0 pointer-events-none opacity-75">
              <FlowerIcon type="blue" size={34} />
            </div>
            <div className="absolute bottom-24 right-2 pointer-events-none opacity-80">
              <FlowerIcon type="blue" size={30} />
            </div>

            <div className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-white/90 shadow-sm border border-pink-100 mb-4 text-xs sm:text-sm font-semibold tracking-wider text-pink-600 uppercase">
              <Heart className="w-3.5 h-3.5 fill-pink-500 text-pink-500" />
              <span>OUR ALBUM</span>
            </div>

            <h2 className="font-serif-display text-2xl sm:text-3xl font-semibold text-[#1e293b] mb-1">
              {data.albumTitle}
            </h2>

            <p className="font-script text-xl sm:text-2xl text-[#64748b] mb-6">{data.albumSubtitle}</p>

            <div className="relative w-full max-w-sm bg-white rounded-3xl p-4 shadow-[0_12px_36px_rgba(0,0,0,0.06)] border border-[#e2e8f0] mb-6 flex flex-col items-center">
              <button
                onClick={handlePrev}
                aria-label="Previous photo"
                className="absolute -left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow-md border border-[#e2e8f0] text-[#64748b] hover:text-pink-600 flex items-center justify-center transition-all hover:scale-110 z-20 cursor-pointer"
              >
                <ArrowLeft className="w-4 h-4" />
              </button>

              <button
                onClick={handleNext}
                aria-label="Next photo"
                className="absolute -right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white shadow-md border border-[#e2e8f0] text-[#64748b] hover:text-pink-600 flex items-center justify-center transition-all hover:scale-110 z-20 cursor-pointer"
              >
                <ArrowRight className="w-4 h-4" />
              </button>

              <div className="w-full aspect-[4/3] rounded-2xl overflow-hidden bg-pink-50 relative shadow-inner border border-pink-100">
                <AnimatePresence mode="wait">
                  <motion.img
                    key={currentMem?.id || currentIndex}
                    src={currentMem?.imageUrl}
                    alt={currentMem?.caption || "Memory photo"}
                    initial={{ opacity: 0, scale: 0.95 }}
                    animate={{ opacity: 1, scale: 1 }}
                    exit={{ opacity: 0, scale: 1.05 }}
                    transition={{ duration: 0.35 }}
                    className="w-full h-full object-cover"
                    loading="lazy"
                  />
                </AnimatePresence>
              </div>

              <div className="mt-4 text-[11px] font-bold tracking-widest text-[#94a3b8] uppercase font-mono">
                {currentMem?.dateOrTag || `MEMORY 0${currentIndex + 1} / 0${memories.length}`}
              </div>

              <AnimatePresence mode="wait">
                <motion.p
                  key={`cap-${currentIndex}`}
                  initial={{ opacity: 0, y: 4 }}
                  animate={{ opacity: 1, y: 0 }}
                  exit={{ opacity: 0, y: -4 }}
                  transition={{ duration: 0.25 }}
                  className="mt-2 text-xs sm:text-sm text-[#475569] font-script text-lg sm:text-xl leading-snug px-2 min-h-[50px] flex items-center justify-center"
                >
                  {currentMem?.caption}
                </motion.p>
              </AnimatePresence>

              <div className="flex gap-1.5 mt-2">
                {memories.map((_, idx) => (
                  <button
                    key={idx}
                    onClick={() => {
                      audioEngine.playPageTurn();
                      setCurrentIndex(idx);
                    }}
                    aria-label={`Go to photo ${idx + 1}`}
                    className={`h-2 rounded-full transition-all cursor-pointer ${
                      idx === currentIndex ? "w-6 bg-rose-500" : "w-2 bg-rose-200 hover:bg-rose-300"
                    }`}
                  />
                ))}
              </div>
            </div>

            <motion.button
              whileHover={{ scale: 1.03 }}
              whileTap={{ scale: 0.97 }}
              onClick={onNext}
              className="w-full max-w-xs py-3.5 px-6 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-rose-600 hover:from-rose-600 hover:to-pink-700 text-white font-semibold text-xs sm:text-sm tracking-wider uppercase shadow-[0_8px_22px_rgba(244,63,94,0.35)] flex items-center justify-center gap-2 cursor-pointer transition-all"
            >
              <span>PICK A WISH</span>
              <ArrowRight className="w-4 h-4" />
            </motion.button>
          </motion.div>
        );
      };

      /* ============================================================
       * BouquetScreen
       * ============================================================ */
      const BouquetScreen = ({ data, onNext }) => {
        const [openedWishIds, setOpenedWishIds] = useState({});
        const wishes = data.wishes || [];

        const handlePickFlower = (wish, index, event) => {
          if (openedWishIds[wish.id]) return;

          audioEngine.playFlowerBloom();

          const rect = event.currentTarget.getBoundingClientRect();
          const originX = (rect.left + rect.width / 2) / window.innerWidth;
          const originY = (rect.top + rect.height / 2) / window.innerHeight;
          triggerFlowerBloomConfetti(originX, originY);

          setOpenedWishIds((prev) => ({
            ...prev,
            [wish.id]: true,
          }));
        };

        return (
          <motion.div
            initial={{ opacity: 0, y: 15 }}
            animate={{ opacity: 1, y: 0 }}

            ...data,
            memories: [...data.memories, newMem],

                              const updated = [...data.wishes];
                              updated[idx] = { ...updated[idx], title: e.target.value };
                              setData({ ...data, wishes: updated });
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-[#cbd5e1] bg-white text-sm"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-bold uppercase text-[#475569] mb-1">
                            Flower {idx + 1} Secret Message
                          </label>
                          <textarea
                            rows={2}
                            value={wish.message}
                            onChange={(e) => {
                              const updated = [...data.wishes];
                              updated[idx] = { ...updated[idx], message: e.target.value };
                              setData({ ...data, wishes: updated });
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-[#cbd5e1] bg-white text-sm"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === "letter" && (
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-[#64748b] mb-1">Salutation</label>
                      <input
                        type="text"
                        value={data.letterSalutation}
                        onChange={(e) => setData({ ...data, letterSalutation: e.target.value })}
                        className="w-full px-3 py-2 rounded-xl border border-[#cbd5e1] text-sm"
                      />
                    </div>

                    {data.letterParagraphs.map((para, pIdx) => (
                      <div key={pIdx}>
                        <label className="block text-xs font-bold uppercase text-[#64748b] mb-1">Paragraph {pIdx + 1}</label>
                        <textarea
                          rows={3}
                          value={para}
                          onChange={(e) => {
                            const updated = [...data.letterParagraphs];
                            updated[pIdx] = e.target.value;
                            setData({ ...data, letterParagraphs: updated });
                          }}
                          className="w-full px-3 py-2 rounded-xl border border-[#cbd5e1] text-sm"
                        />
                      </div>
                    ))}

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold uppercase text-[#64748b] mb-1">Closing</label>
                        <input
                          type="text"
                          value={data.letterClosing}
                          onChange={(e) => setData({ ...data, letterClosing: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-[#cbd5e1] text-sm"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase text-[#64748b] mb-1">Sender Signature</label>
                        <input
                          type="text"
                          value={data.letterSender}
                          onChange={(e) => setData({ ...data, letterSender: e.target.value })}
                          className="w-full px-3 py-2 rounded-xl border border-[#cbd5e1] text-sm"
                        />
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div className="px-6 py-4 border-t border-[#f1f5f9] flex items-center justify-end gap-3 bg-white">
                <button onClick={onClose} className="px-4 py-2 rounded-full text-xs font-bold text-[#64748b] hover:bg-gray-100 cursor-pointer transition-colors">
                  Cancel
                </button>
                <button
                  onClick={handleSave}
                  className="px-6 py-2 rounded-full bg-pink-500 hover:bg-pink-600 text-white text-xs font-bold flex items-center gap-1.5 shadow-md cursor-pointer transition-all hover:scale-105"
                >
                  <Save className="w-4 h-4" />
                  <span>Apply Changes</span>
                </button>
              </div>
            </motion.div>
          </div>
        );
      };

      /* ============================================================
       * InstagramIntroModal
       * ============================================================ */
      const InstagramIntroModal = ({ isOpen, onClose, onEnterSurprise, recipientName = "girllllll" }) => {
        const [messagesShown, setMessagesShown] = useState(0);

        const script = [
          { sender: "them", text: "7 mins to goooo yayy" },
          { sender: "them", text: "6 minsss" },
          { sender: "them", text: "5 minssss" },
          { sender: "them", text: "4 minutes onlyyyy" },
          { sender: "them", text: "3 minutesssss" },
          { sender: "them", text: "2 mins to gooo" },
          { sender: "them", text: "1 minssss" },
          { sender: "me", text: "YAYAY ITS MY BIRTHDAYY" },
          { sender: "them", text: `ANDDD HERE IS YOUR GIFT ${recipientName.toUpperCase()}!` },
          { sender: "them", text: "I MADE THIS CUTIEPAGE FOR YOUUU" },
          { sender: "card", text: "Open Birthday Surprise Page ✨" },
        ];

        useEffect(() => {
          if (!isOpen) {
            setMessagesShown(0);
            return;
          }

          setMessagesShown(1);
          const interval = setInterval(() => {
            setMessagesShown((prev) => {
              if (prev < script.length) {
                audioEngine.playChime(600 + prev * 40, 0.2, 0.04);
                return prev + 1;
              } else {
                clearInterval(interval);
                return prev;
              }
            });
          }, 900);

          return () => clearInterval(interval);
        }, [isOpen]);

        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-4">
            <motion.div
              initial={{ opacity: 0, scale: 0.92 }}
              animate={{ opacity: 1, scale: 1 }}
              exit={{ opacity: 0, scale: 0.92 }}
              className="w-full max-w-sm h-[85vh] max-h-[640px] rounded-3xl overflow-hidden shadow-2xl bg-gradient-to-b from-[#1b0a2a] via-[#150424] to-[#0c0217] text-white flex flex-col border border-pink-500/20 relative"
            >
              <div className="bg-white/5 backdrop-blur-md p-3 px-4 flex items-center justify-between border-b border-white/10 shrink-0">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 p-0.5">
                    <div className="w-full h-full rounded-full bg-[#150424] flex items-center justify-center text-xs">💖</div>
                  </div>
                  <div>
                    <p className="text-xs font-bold leading-tight flex items-center gap-1">
                      <span>It was her birthday...</span>
                    </p>
                    <p className="text-[10px] text-pink-300">Midnight Countdown Surprise</p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 transition-colors cursor-pointer"
                >
                  <X className="w-4 h-4" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-2.5 flex flex-col justify-end bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-pink-900/20 via-transparent to-transparent">
                {script.slice(0, messagesShown).map((msg, i) => {
                  if (msg.sender === "card") {
                    return (
                      <motion.div key={i} initial={{ opacity: 0, scale: 0.8 }} animate={{ opacity: 1, scale: 1 }} className="self-start w-full my-2">
                        <button
                          onClick={() => {
                            onClose();
                            onEnterSurprise();
                          }}
                          className="w-full bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white rounded-2xl p-4 shadow-[0_0_25px_rgba(244,63,94,0.4)] border border-pink-400/40 text-left transition-all hover:scale-[1.02] cursor-pointer group"
                        >
                          <div className="flex items-center gap-3">
                            <div className="w-12 h-12 rounded-xl bg-white/20 flex items-center justify-center backdrop-blur-xs shrink-0 group-hover:scale-110 transition-transform">
                              <QrCode className="w-7 h-7 text-white" />
                            </div>
                            <div>
                              <div className="flex items-center gap-1 text-[11px] font-bold tracking-wider uppercase text-pink-200">
                                <Sparkles className="w-3 h-3 text-pink-300" />
                                <span>SURPRISE UNLOCKED</span>
                              </div>
                              <p className="text-sm font-semibold text-white">Tap to Open Cutiepage 💌</p>
                            </div>
                          </div>
                        </button>
                      </motion.div>
                    );
                  }

                  const isMe = msg.sender === "me";
                  return (
                    <motion.div
                      key={i}
                      initial={{ opacity: 0, y: 10, scale: 0.95 }}
                      animate={{ opacity: 1, y: 0, scale: 1 }}
                      className={`max-w-[78%] px-3.5 py-2 rounded-2xl text-xs sm:text-sm font-medium ${
                        isMe
                          ? "self-end bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-br-xs"
                          : "self-start bg-white/10 backdrop-blur-xs text-white/90 rounded-bl-xs border border-white/5"
                      }`}
                    >
                      {msg.text}
                    </motion.div>
                  );
                })}
              </div>

              <div className="p-3 bg-black/40 border-t border-white/10 flex items-center gap-2 shrink-0">
                <div className="flex-1 bg-white/10 rounded-full px-4 py-2 text-xs text-white/40 flex items-center justify-between">
                  <span>Message...</span>
                  <div className="flex gap-2 text-white/60">
                    <Heart className="w-3.5 h-3.5" />
                  </div>
                </div>
                <button
                  onClick={() => {
                    onClose();
                    onEnterSurprise();
                  }}
                  className="w-9 h-9 rounded-full bg-pink-500 text-white flex items-center justify-center hover:bg-pink-600 transition-colors cursor-pointer shrink-0"
                >
                  <Send className="w-4 h-4 ml-0.5" />
                </button>
              </div>
            </motion.div>
          </div>
        );
      };

      /* ============================================================
       * App
       * ============================================================ */
      function App() {
        const [currentTheme, setCurrentTheme] = useState("theme-rose");
        const [data] = useState(() => {
          try {
            if (window.location.hash.startsWith("#data=")) {
              const jsonStr = decodeURIComponent(window.location.hash.slice(6));
              const parsed = JSON.parse(jsonStr);
              if (parsed && parsed.introTitle) {
                return parsed;
              }
            }
          } catch (e) {
            // fallback to default
          }
          return DEFAULT_SURPRISE_DATA;
        });

        // 0: Envelope, 1: Greeting + Music, 2: Album, 3: Bouquet, 4: Letter
        const [currentStep, setCurrentStep] = useState(0);

        useEffect(() => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, [currentStep]);

        const handleNextStep = () => {
          setCurrentStep((prev) => Math.min(4, prev + 1));
        };

        const handleRestart = () => {
          setCurrentStep(0);
        };

        return (
          <div
            className={`min-h-screen ${currentTheme} ${
              currentTheme === "theme-twilight" ? "text-rose-100" : "text-[#2c3e50]"
            } flex flex-col justify-between relative selection:bg-rose-200 selection:text-rose-900 overflow-x-hidden font-ui transition-colors duration-500`}
          >
            <TopBar
              currentStep={currentStep}
              totalSteps={5}
              currentTheme={currentTheme}
              onSelectTheme={(theme) => setCurrentTheme(theme)}
              onNavigateStep={(step) => setCurrentStep(step)}
            />

            <main className="flex-1 flex flex-col items-center justify-center pt-16 pb-12 px-4 w-full">
              <AnimatePresence mode="wait">
                {currentStep === 0 && <EnvelopeScreen key="step-0-envelope" data={data} onOpen={handleNextStep} />}

                {currentStep === 1 && <GreetingScreen key="step-1-greeting" data={data} onNext={handleNextStep} />}

                {currentStep === 2 && (
                  <AlbumScreen key="step-2-album" data={data} onNext={handleNextStep} onBack={() => setCurrentStep(1)} />
                )}

                {currentStep === 3 && <BouquetScreen key="step-3-bouquet" data={data} onNext={handleNextStep} />}

                {currentStep === 4 && <LetterScreen key="step-4-letter" data={data} onRestart={handleRestart} />}
              </AnimatePresence>
            </main>

            <footer className="py-4 text-center text-xs text-[#94a3b8] flex items-center justify-center gap-1.5 border-t border-rose-200/40 bg-white/60 backdrop-blur-xs font-mono">
              <span>coded & made with all my love, just for you</span>
              <span className="text-rose-500">♡</span>
            </footer>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
